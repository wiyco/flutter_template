# https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{dart}"
      run: dart fix --apply
      stage_fixed: true
      skip:
        - merge
        - rebase

post-merge:
  commands:
    npm:
      glob: "{pubspec.yaml}"
      run: flutter pub get
